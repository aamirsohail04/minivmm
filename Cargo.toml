[package]
name = "minivmm"
version = "0.1.0"
authors = ["Aamir Sohail"]
edition = "2024"
rust-version = "1.85"
description = "A small learning VMM built on the rust-vmm crates"
license = "Apache-2.0 OR BSD-3-Clause"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "minivmm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
kvm-bindings = "0.14"
kvm-ioctls = "0.25"
libc = "0.2"
vm-memory = { version = "0.18", features = ["backend-mmap"] }
vm-superio = "0.8"
vmm-sys-util = "0.15"

[profile.release]
debug = 1
