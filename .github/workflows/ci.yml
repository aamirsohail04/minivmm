name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # Hosted runners usually have no /dev/kvm, so the end-to-end tests
    # skip themselves here; run them locally on a KVM host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y nasm busybox-static cpio
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Keep the guest initramfs script working (the boot tests that use it
      # need KVM, so they skip here).
      - run: ./scripts/make-initramfs.sh /tmp/initramfs.cpio.gz
